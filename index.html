<h1>AutoClip</h1>
<p>AutoClip is a personal, non-commercial tool. It turns the owner's own long videos into short clips and uploads them, with titles, descriptions and thumbnails, to the owner's own YouTube channels.</p>
<p>It is not offered to the public and has no other users.</p>
